<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrewDesk — Enterprise Agency ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #F6F5F0;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      @keyframes progressTrack {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(100%); }
        100% { transform: translateX(250%); }
      }
      .loading-progress {
        animation: progressTrack 1.4s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; background-color: #F6F5F0; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none;">
        <div style="display: flex; flex-direction: column; align-items: center; max-width: 280px; width: 100%; text-align: center;">
          <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #0f766e, #004d47); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(0, 77, 71, 0.25); margin-bottom: 20px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
          </div>
          <div style="font-size: 18px; font-weight: 700; color: #0f172a; letter-spacing: -0.02em;">CrewDesk</div>
          <div style="font-size: 10px; font-weight: 600; font-family: monospace; letter-spacing: 0.15em; text-transform: uppercase; color: #005c55; margin-top: 4px;">Enterprise Agency ERP</div>
          <div style="width: 180px; height: 4px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; margin-top: 24px; position: relative;">
            <div class="loading-progress" style="position: absolute; top: 0; bottom: 0; left: 0; width: 50%; border-radius: 9999px; background: linear-gradient(90deg, #0d9488, #10b981);"></div>
          </div>
          <div style="font-size: 12px; color: #64748b; font-weight: 500; margin-top: 14px; display: flex; align-items: center; gap: 6px;">
            <span style="width: 6px; height: 6px; border-radius: 9999px; background-color: #0d9488;"></span>
            <span>Initializing CrewDesk ERP...</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
